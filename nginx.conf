user nginx;
worker_processes auto;
error_log /var/log/nginx/error.log notice;
pid /run/nginx.pid;
include /usr/share/nginx/modules/*.conf;

events {
    worker_connections 1024;
}

http {
    log_format  main  '$remote_addr - $remote_user [$time_local] "$request" '
                      '$status $body_bytes_sent "$http_referer" '
                      '"$http_user_agent" "$http_x_forwarded_for"';
    access_log  /var/log/nginx/access.log  main;
    sendfile            on;
    tcp_nopush          on;
    keepalive_timeout   65;
    types_hash_max_size 4096;

    include             /etc/nginx/mime.types;
    default_type        application/octet-stream;

    server {

        if ($host = www.ranvir.tech) {
            return 301 https://www.numbersandreality.com$request_uri;
        }

        if ($host = ranvir.tech) {
            return 301 https://www.numbersandreality.com$request_uri;
        }

        if ($host = numbersandreality.com) {
            return 301 https://www.numbersandreality.com$request_uri;
        }
        server_name  numbersandreality.com www.numbersandreality.com ranvir.tech www.ranvir.tech;
        root         /usr/share/nginx/html;

        listen 443 ssl;
        ssl_certificate /etc/letsencrypt/live/numbersandreality.com/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/numbersandreality.com/privkey.pem;
        include /etc/letsencrypt/options-ssl-nginx.conf;
        ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
    }

    server {
        if ($host = www.ranvir.tech) {
            return 301 https://www.numbersandreality.com$request_uri;
        }

        if ($host = www.numbersandreality.com) {
            return 301 https://www.numbersandreality.com$request_uri;
        }

        if ($host = ranvir.tech) {
            return 301 https://www.numbersandreality.com$request_uri;
        }

        if ($host = numbersandreality.com) {
            return 301 https://www.numbersandreality.com$request_uri;
        }

        listen       80;
        server_name  numbersandreality.com www.numbersandreality.com ranvir.tech www.ranvir.tech;
        return 404;
    }
}
